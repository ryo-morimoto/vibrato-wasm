[package]
name = "vibrato-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "vibrato Japanese morphological analyzer compiled to WebAssembly"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
vibrato = { version = "0.5", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
ruzstd = "0.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
